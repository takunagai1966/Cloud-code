<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="560" height="300" fill="#FBF7EF"/>
  <text x="280" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#2A2420">新規ジョイント コンセプトA：工具レス・クォーターターン・カム方式（模式図）</text>

  <!-- node body -->
  <rect x="60" y="90" width="140" height="140" rx="18" fill="#3E5C4E" stroke="#233B31" stroke-width="2"/>
  <circle cx="200" cy="160" r="34" fill="#233B31" fill-opacity=".35" stroke="#233B31" stroke-width="2"/>
  <path d="M226,138 A34,34 0 0 1 226,182" fill="none" stroke="#F2E9DA" stroke-width="3" opacity=".85"/>
  <line x1="222" y1="132" x2="230" y2="128" stroke="#F2E9DA" stroke-width="1.5" opacity=".7"/>
  <line x1="230" y1="160" x2="238" y2="160" stroke="#F2E9DA" stroke-width="1.5" opacity=".7"/>
  <line x1="222" y1="188" x2="230" y2="192" stroke="#F2E9DA" stroke-width="1.5" opacity=".7"/>

  <!-- rotation arrow -->
  <path d="M222,128 A34,34 0 1 1 178,128" fill="none" stroke="#8FC3AB" stroke-width="2.5" marker-end="url(#arrow-a)"/>
  <text x="200" y="96" text-anchor="middle" font-size="12" fill="#233B31">② 90°回して固定</text>

  <!-- straight insertion arrow -->
  <line x1="330" y1="160" x2="240" y2="160" stroke="#2A2420" stroke-width="2" marker-end="url(#arrow-a)"/>
  <text x="284" y="146" text-anchor="middle" font-size="12" fill="#2A2420">① 差し込む</text>

  <!-- tube -->
  <rect x="340" y="140" width="180" height="40" rx="6" fill="#D7DBDC" stroke="#8A9296" stroke-width="2"/>

  <!-- cam pin -->
  <rect x="333" y="135" width="10" height="50" fill="#233B31" opacity=".55"/>
  <line x1="336" y1="140" x2="336" y2="180" stroke="#F2E9DA" stroke-width="1" opacity=".5"/>
  <line x1="339" y1="140" x2="339" y2="180" stroke="#F2E9DA" stroke-width="1" opacity=".5"/>
  <circle cx="345" cy="160" r="12" fill="#3E5C4E" stroke="#233B31" stroke-width="1.5"/>
  <line x1="345" y1="160" x2="353" y2="153" stroke="#F2E9DA" stroke-width="2"/>

  <!-- callouts -->
  <text x="40" y="70" font-size="12" fill="#2A2420">ノード本体（新規ジョイント）</text>
  <line x1="90" y1="74" x2="105" y2="90" stroke="#7A6D5C" stroke-width="1"/>

  <text x="345" y="225" text-anchor="middle" font-size="12" fill="#2A2420">カムピン（回転式ロック）</text>
  <line x1="345" y1="220" x2="345" y2="174" stroke="#7A6D5C" stroke-width="1"/>

  <text x="205" y="256" text-anchor="middle" font-size="12" fill="#2A2420">テーパー溝（回転で引き込む）</text>
  <line x1="205" y1="251" x2="205" y2="194" stroke="#7A6D5C" stroke-width="1"/>

  <text x="470" y="90" text-anchor="middle" font-size="12" fill="#233B31" font-weight="700">手で回すだけ・工具不要</text>

  <text x="550" y="292" text-anchor="end" font-size="10" fill="#7A6D5C">※開発中の概念図であり、実際の製品仕様ではありません</text>

  <defs>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A2420"/>
    </marker>
  </defs>
</svg>
